services:
  - type: web
    name: slow-xv
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: WEB_PAIR_PASSWORD
        sync: false
      - key: MAX_SESSIONS
        value: "20"
      - key: DEVELOPER_NAME
        value: "VArnox Tech"
      - key: SESSIONS_DIR
        value: "/tmp/slow-xv-sessions"
      - key: DATA_DIR
        value: "/tmp/slow-xv-data"
      - key: TEMP_DIR
        value: "/tmp/slow-xv"
      - key: NEWSLETTER_JID
        value: "120363424782348922@newsletter"
      - key: CHANNEL_INVITE_CODE
        value: "0029Vb7jG2KEawdwHsZiEm1E"
      - key: CHANNEL_URL
        value: "https://whatsapp.com/channel/0029Vb7jG2KEawdwHsZiEm1E"
      - key: CHANNEL_REACTION_EMOJI
        value: "🔥"
      - key: BOT_NAME
        value: "SLOW-XV"
      - key: COMMAND_MODE
        value: "public"
      - key: TIMEZONE
        value: "Africa/Conakry"
    dockerCommand: npm start
