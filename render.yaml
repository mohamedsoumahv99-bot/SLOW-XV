services:
  - type: web
    name: slow-xv
    runtime: docker
    plan: 1c-2g
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=1408
      - key: WEB_PAIR_PASSWORD
        sync: false
      - key: MAX_SESSIONS
        value: "10"
      - key: DEVELOPER_NAME
        value: "VArnox Tech"
      - key: SESSIONS_DIR
        value: "/data/sessions"
      - key: DATA_DIR
        value: "/data/data"
      - key: TEMP_DIR
        value: "/tmp/slow-xv"
      - key: NEWSLETTER_JID
        value: "120363424782348922@newsletter"
      - key: CHANNEL_INVITE_CODE
        value: "0029Vb7jG2KEawdwHsZiEm1E"
      - key: BOT_NAME
        value: "SLOW-XV"
      - key: COMMAND_MODE
        value: "public"
      - key: TIMEZONE
        value: "Africa/Conakry"
    dockerCommand: npm start
    disk:
      name: slow-xv-data
      mountPath: /data
      sizeGB: 1
